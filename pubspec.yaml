name: bechakena
description: "Offline-first retail and restaurant POS with configurable shop currency."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  drift: ^2.34.1
  intl: ^0.20.2
  uuid: ^4.5.3
  path_provider: ^2.1.6
  path: ^1.9.1
  file_selector: ^1.1.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  crypto: ^3.0.7
  image: ^4.5.4
  pdf: ^3.11.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.4
  sqlite3: ^3.5.2

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Bengali glyph fallback — CanvasKit on the web has no system fonts, and
    # cheap Windows installs may lack a Bengali face. Bundled so বাংলা renders
    # everywhere (also listed as fallback in the app theme).
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
