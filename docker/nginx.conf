# BechaKena showcase — static serving for the Docker image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Flutter deep links (e.g. /demo/settings) resolve inside the demo.
    location = /demo {
        return 308 /demo/;
    }
    location /demo/ {
        # SharedArrayBuffer (Drift's web worker) needs cross-origin isolation.
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}
